workflows:
  android-debug-apk:
    name: GeTech - APK Debug
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17

    scripts:

      - name: Verificar projeto
        script: |
          cd ArquivoParanormal-Android-Firebase-SINCRONIZADO

          echo "=== DIRETÓRIO DO PROJETO ==="
          pwd

          echo "=== ARQUIVOS ==="
          ls -la

          echo "=== APP ==="
          ls -la app

          echo "=== BUILD GRADLE ==="
          if [ -f build.gradle ]; then
            echo "build.gradle encontrado"
          elif [ -f build.gradle.kts ]; then
            echo "build.gradle.kts encontrado"
          else
            echo "ERRO: build.gradle não encontrado"
            exit 1
          fi

      - name: Verificar Gradle
        script: |
          cd ArquivoParanormal-Android-Firebase-SINCRONIZADO

          echo "=== VERSÃO DO GRADLE ==="
          gradle --version

      - name: Gerar APK
        script: |
          cd ArquivoParanormal-Android-Firebase-SINCRONIZADO

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verificar APK
        script: |
          cd ArquivoParanormal-Android-Firebase-SINCRONIZADO

          echo "=== APK GERADO ==="
          ls -lh app/build/outputs/apk/debug/

          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERRO: APK não foi gerado"
            exit 1
          fi

          echo "APK encontrado com sucesso!"

    artifacts:
      - ArquivoParanormal-Android-Firebase-SINCRONIZADO/app/build/outputs/apk/debug/app-debug.apk
