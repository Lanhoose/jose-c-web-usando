# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# A partir do AGP 9, o "Kotlin embutido" passou a ser o padrão, o que entra em
# conflito com o plugin org.jetbrains.kotlin.android aplicado manualmente
# neste projeto (necessário por causa do kotlin("plugin.serialization")).
# Estas são válvulas de escape oficiais do Google, válidas até o AGP 10
# (esperado ainda em 2026), que preservam o comportamento atual sem precisar
# migrar tudo agora.
android.builtInKotlin=false
android.newDsl=false
