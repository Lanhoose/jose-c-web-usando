<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linha de Produção - GeTech</title><link rel="stylesheet" href="../../assets/css/global.css"><link rel="stylesheet" href="../../assets/css/app.css"></head><body><div class="header"><div class="header-left"><h1>Linha de Produção</h1><p>Módulo GeTech</p></div><div class="header-actions"><button class="btn-voltar" onclick="location.href='../../app.html'">Voltar</button></div></div><div class="container"><div class="card"><h3>Linha de Produção</h3><p>Monitoramento industrial e indicadores locais.</p><div style="margin-top:20px"><input id="item" placeholder="Registro" style="padding:12px;width:70%"><button onclick="salvar()">Salvar</button></div><div id="lista"></div></div></div><script>const k='getech_producao';let a=JSON.parse(localStorage.getItem(k)||'[]');function render(){lista.innerHTML=a.map((x,i)=>'<p>'+x+' <button onclick="remover('+i+')">Excluir</button></p>').join('')||'<p>Nenhum registro.</p>'}function salvar(){if(!item.value.trim())return;a.push(item.value.trim());localStorage.setItem(k,JSON.stringify(a));item.value='';render()}function remover(i){a.splice(i,1);localStorage.setItem(k,JSON.stringify(a));render()}render();</script></body></html>
