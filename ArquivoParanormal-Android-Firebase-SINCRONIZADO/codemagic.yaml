workflows:
  android-debug-apk:
    name: GeTech - APK Debug
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Verificar projeto
        script: |
          echo "Raiz: $(pwd)"
          ls -la
          test -d app
          test -f build.gradle || test -f build.gradle.kts
      - name: Gerar APK com Gradle
        script: |
          gradle clean assembleDebug --stacktrace --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
